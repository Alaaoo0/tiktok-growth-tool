<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok Video Analyzer</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101014;
    color: white;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.subtitle {
    text-align: center;
    color: #aaa;
}

.card {
    background: #1c1c22;
    padding: 20px;
    margin-top: 20px;
    border-radius: 16px;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #444;
    background: #111;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: #ff0050;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:active {
    transform: scale(.98);
}

.result {
    margin-top: 20px;
    line-height: 1.8;
}

.link {
    direction: ltr;
    text-align: left;
    word-break: break-all;
    background: #111;
    padding: 12px;
    border-radius: 10px;
}

</style>

</head>

<body>

<div class="container">

<h1>🔥 TikTok Video Analyzer</h1>

<p class="subtitle">
أداة تحليل فيديو TikTok
</p>

<div class="card">

<h2>🔗 رابط الفيديو</h2>

<input
    id="videoUrl"
    type="url"
    placeholder="ضع رابط فيديو TikTok هنا"
>

<button onclick="analyzeVideo()">
تحليل الفيديو
</button>

</div>

<div id="result"></div>

</div>


<script>

function analyzeVideo() {

    const url =
        document.getElementById("videoUrl").value.trim();

    const result =
        document.getElementById("result");


    if (url === "") {

        result.innerHTML = `
        <div class="card">
            ❌ ضع رابط فيديو TikTok أولاً.
        </div>
        `;

        return;
    }


    if (!url.includes("tiktok.com")) {

        result.innerHTML = `
        <div class="card">
            ❌ الرابط لا يبدو كرابط TikTok صحيح.
        </div>
        `;

        return;
    }


    result.innerHTML = `

    <div class="card result">

        <h2>✅ تم استلام الرابط</h2>

        <div class="link">
            ${escapeHtml(url)}
        </div>

        <h3>📊 حالة التحليل</h3>

        <p>
        الرابط جاهز للتحليل.
        </p>

        <p>
        ⚠️ حاليًا الموقع لا يجلب أرقام TikTok تلقائيًا،
        لأن ذلك يحتاج إلى مصدر بيانات/API مناسب.
        </p>

        <h3>🚀 ما سنضيفه لاحقًا</h3>

        <ul>
            <li>👁️ عدد المشاهدات</li>
            <li>❤️ عدد الإعجابات</li>
            <li>💬 عدد التعليقات</li>
            <li>🔄 عدد المشاركات</li>
            <li>📈 معدل التفاعل</li>
            <li>💡 اقتراحات لتحسين الفيديو</li>
        </ul>

    </div>

    `;

}


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>

</html>
