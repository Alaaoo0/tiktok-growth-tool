<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TikTok Analytics Tool</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f0f12;
    color: white;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #aaa;
}

.card {
    background: #1b1b20;
    padding: 20px;
    border-radius: 16px;
    margin-top: 20px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 7px 0;
    border: 1px solid #444;
    border-radius: 10px;
    background: #111;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: 0;
    border-radius: 10px;
    background: #ff0050;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:hover {
    opacity: .9;
}

.stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 15px;
}

.stat {
    background: #25252c;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
}

.stat strong {
    display: block;
    font-size: 22px;
    margin-top: 5px;
}

.result {
    line-height: 1.8;
}

.good {
    padding: 12px;
    background: #183d27;
    border-radius: 10px;
    margin-top: 10px;
}

.warning {
    padding: 12px;
    background: #49351a;
    border-radius: 10px;
    margin-top: 10px;
}

ul {
    padding-right: 25px;
}

@media (max-width: 600px) {
    .stats {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 TikTok Analytics Tool</h1>

</p>

<input id="likes" type="number" placeholder="عدد الإعجابات">

<input id="comments" type="number" placeholder="عدد التعليقات">

<input id="shares" type="number" placeholder="عدد المشاركات">

<input id="followers" type="number" placeholder="عدد المتابعين">

<button onclick="analyze()">تحليل الفيديو</button>

</div>

<div id="output"></div>

</div>
